name: Tanishq 22K Gold Rate Agent

on:
  schedule:
    # 12:00 PM IST corresponds to 06:30 UTC (UTC + 5:30)
    - cron: '27 3 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime

permissions:
  contents: write # Grants GitHub Actions permission to commit and push

jobs:
  track-gold:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape Tanishq Gold Rate & Prepare Commit
        run: python tracker.py

      - name: Commit and Push (Triggers Native Email Hook)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add latest_gold_rate.txt gold_rate_history.csv
          
          if [ -f commit_message.txt ]; then
            git commit -F commit_message.txt
            git push origin HEAD
            echo "Push complete. GitHub email notification triggered."
          else
            echo "No commit message file found. Skipping push."
          fi
